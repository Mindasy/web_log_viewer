name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 安装 zsh（用于 update-tool.zsh 语法检查）
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: 全量验证（含重型解析 + 服务器冒烟）
        run: |
          bash test/validate.sh --force

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 注入版本号并打包
        run: |
          bash scripts/package.sh "${GITHUB_REF_NAME}"

      - name: 读取版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "archive=output/v${VERSION}/weblogviewer.tar.gz" >> $GITHUB_OUTPUT
          echo "pages_dir=output/v${VERSION}/pages" >> $GITHUB_OUTPUT

      - name: 解压到 Pages 目录
        run: |
          mkdir -p "${{ steps.version.outputs.pages_dir }}"
          tar -xzf "${{ steps.version.outputs.archive }}" \
            -C "${{ steps.version.outputs.pages_dir }}"

      - name: 创建 Release 附件
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.version.outputs.archive }}
            tools/update-tool.sh
            tools/update-tool.zsh
            tools/update-tool.bat
            tools/callstack/extract_callstack.py
            tools/callstack/perf_to_callstack.py
            tools/callstack/collect_perf_callstack.sh
            tools/callstack/doxygen_callstack.py
            tools/source_link/index_source.py
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 工件
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.version.outputs.pages_dir }}

      - name: 清理旧 Pages 部署
        run: |
          gh api repos/${{ github.repository }}/deployments?environment=github-pages \
            --jq '.[] | select(.status != "inactive") | .id' | \
          while read id; do
            echo "→ 标记部署 $id 为 inactive"
            gh api repos/${{ github.repository }}/deployments/$id/statuses \
              -f state=inactive -f description="已由新部署替换" --silent
          done
          echo "✅ 旧部署已清理"

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
